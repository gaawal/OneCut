[tool.poetry]
name = "OneCut"
version = "0.1.0"
description = "OneCut"
authors = ["jiahualink <840132699@qq.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.100.0"
uvicorn = "^0.23.1"
tortoise-orm = "^0.19.3"
pydantic = "^2.3.0"
email-validator = "^2.0.0.post2"
passlib = "^1.7.4"
pyjwt = "^2.7.0"
black = "^23.7.0"
isort = "^5.12.0"
ruff = "^0.0.281"
loguru = "^0.7.0"
pydantic-settings = "^2.0.3"
argon2-cffi = "^23.1.0"
toml = "^0.10.2"
redis = "^5.0.6"
urllib3 = "^2.2.2"
openai = "^1.35.4"
requests = "^2.32.3"
moviepy = "^2.0.0.dev2"
edge-tts = "^6.1.12"
faster_whisper = "^1.0.2"
mutagen = "^1.47.0"
pydub = "^0.25.1"
python-multipart = "^0.0.9"
apscheduler = "^3.10.4"
pillow = "^10.3.0"
numpy = "<2.0.0"
onnxruntime = "^1.18.0"
opencv-python = ">=4.9.0.80,<4.10.0.0" # 添加这一行解决module 'PIL.Image' has no attribute 'ANTIALIAS'

[tool.black]
line-length = 120
target-version = ["py310", "py311"]

[[tool.poetry.source]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
priority = "primary"

[tool.ruff]
line-length = 120
extend-select = [
    # "I",    # isort
    #   "B",    # flake8-bugbear
    #   "C4",   # flake8-comprehensions
    #   "PGH",  # pygrep-hooks
    # "RUF",  # ruff
    #   "W",    # pycodestyle
    #   "YTT",  # flake8-2020
]
ignore = [
    "F403",
    "F405",
]